# This workflow implements the continuous integration (CI) pipeline.
# It verifies that pull requests meet certain standards in software quality and coding conventions.
#
# It is triggered automatically by pull requests opened towards the `main` branch.

name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize

# Cancel all previous runs of this workflow that are still in progress on the same branch.
# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All third-party actions are pinned to a specific commit SHA for security reasons.
# https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
jobs:
  integrity:
    name: Integrity
    # Skip draft pull requests to reduce costs.
    if: github.event.pull_request.draft == false
    permissions:
      # To call reusable workflows in the same repository.
      # https://docs.github.com/en/rest/repos/contents?apiVersion=2022-11-28#get-repository-content
      # https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows#example-caller-workflow
      contents: read
    uses: ./.github/workflows/integrity.yml

  commit-messages:
    name: Commit messages
    # Skip verification of commit messages when the software integrity checks fail, as it will most likely require another commit to fix them.
    needs: integrity
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 1
    permissions:
      # To review the commit messages in the pull request.
      # https://docs.github.com/en/rest/pulls/pulls?apiVersion=2022-11-28#list-commits-on-a-pull-request
      pull-requests: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        #
      - name: Verify the commit messages
        # Run the action on itself.
        uses: ./
        with:
          github-token: ${{ github.token }}
          config-path: .github/comet.json
