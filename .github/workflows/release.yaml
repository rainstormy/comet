# This workflow implements the first stage of the release pipeline.
# It creates a release branch and a corresponding pull request towards the `main` branch.
# Upon approving the pull request, the release pipeline automatically proceeds to publish the release.
#
# It can be triggered manually on the `main` branch via the GitHub CLI:
#
#   gh workflow run release.yaml --field version=<major.minor.patch[-prerelease][+buildinfo]>
#   gh run watch
#
# It can also be triggered manually via the GitHub web interface:
# https://github.com/rainstormy/comet/actions/workflows/release.yaml

name: New release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The semantic version number of the new release.
        type: string
        required: true

run-name: ${{ inputs.version }}

# Cancel all previous runs of this workflow that are still in progress on the same branch.
# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All third-party actions are pinned to a specific commit SHA for security reasons.
# https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
jobs:
  integrity:
    name: Integrity
    permissions:
      # To call reusable workflows in the same repository.
      # https://docs.github.com/en/rest/repos/contents?apiVersion=2026-03-10#get-repository-content
      # https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows#example-caller-workflow
      contents: read
    uses: ./.github/workflows/integrity.yaml

  release-branch:
    name: Release branch
    # A release must always be created from the `main` branch.
    if: github.ref_name == 'main'
    needs: integrity
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Include all branches, tags, and history, required for `--force-with-lease` to overwrite an existing branch.
          fetch-depth: 0
          # Use a separate access token with permission to commit and push.
          token: ${{ secrets.BOT_NIMBUS_GH_AUTH_TOKEN }}
        #
      - name: Install dependencies
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: package.json
          version-file: pnpm-workspace.yaml
          cache: true
        #
      - name: Update release artefacts
        uses: rainstormy/updraft@23bb449c54a4e967c87a6943a1ef9a237eafdb99 # v1.2.0
        with:
          check-sequential-release: true
          files: package.json
          release-files: CHANGELOG.md
          release-version: ${{ inputs.version }}
        #
      - name: Generate build artefacts
        # CAUTION: Generate build artefacts after updating the `version` field in `package.json`.
        # This ensures that the `--version` CLI flag and hyperlinks to rule documentation use the new version.
        # language=sh
        run: vpr build
        shell: bash
        #
      - name: Use Nimbus (Bot) in Git
        uses: rainstormy/rainstorm-release/bot-nimbus@5aa67a14e95403e7db0a7a43f8e18c1cdd51ba5f # v1.0.0
        with:
          bot-nimbus-ssh-public-key: ${{ secrets.BOT_NIMBUS_SSH_PUBLIC_KEY }}
          __bot-nimbus-ssh-private-key__: ${{ secrets.BOT_NIMBUS_SSH___THE___PRIVATE___KEY }}
          ssh-key-fingerprints-github: ${{ secrets.SSH_KEY_FINGERPRINTS_GITHUB }}
        #
      - name: Open a pull request
        # language=sh
        run: |
          if git diff --quiet -- package.json; then
            echo 'No changes in package.json.'
            exit 1
          fi

          VERSION="${RAW_VERSION#v}"
          BRANCH="release/$VERSION"
          TITLE="Release $VERSION"

          git switch --create "$BRANCH"
          git add .
          git commit --message "$TITLE"
          git push --force-with-lease --set-upstream origin "$BRANCH"

          if [[ "$(gh pr list --base 'main' --head "$BRANCH" --state open --json number --jq 'length')" == 0 ]]; then
            gh pr create \
              --base 'main' \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body 'This pull request was created automatically by GitHub Actions.'
          fi
        env:
          # Grant the GitHub CLI (gh) permission to open pull requests.
          GH_TOKEN: ${{ secrets.BOT_NIMBUS_GH_AUTH_TOKEN }}
          RAW_VERSION: ${{ inputs.version }}
        shell: bash
